name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: StreamingPluginClient
          path: target/StreamingPluginClient-*-app.jar
          if-no-files-found: error
