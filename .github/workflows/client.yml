name: client

on:
  push:
    # ci-log/* branches are written by the workflows themselves.
    branches: ["**", "!ci-log/**"]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

# contents: write only so the job can publish its build log to a ci-log/* branch.
permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # The pom is not at the repo root in this layout, so the cache action
          # has to be pointed at it explicitly.
          cache-dependency-path: client/pom.xml

      - name: Build and test
        shell: bash # pipefail, so a failing build still fails the step through tee
        run: mvn -B -ntp package 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          # upload-artifact paths are workspace-relative; defaults.run.working-directory
          # only applies to `run` steps.
          name: WiiStreamUStream-Client
          path: client/target/WiiStreamUStream-Client-*-app.jar
          if-no-files-found: error

      # Private repository: publish the log where `git fetch` can read it.
      - name: Publish the build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_BRANCH: ci-log/client
          JOB_STATUS: ${{ job.status }}
        run: bash ../.github/publish-log.sh build.log
