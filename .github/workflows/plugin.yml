name: plugin

on:
  push:
    branches: ["**"]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: plugin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the builder image
        run: docker build . -t wiistreamustream-builder

      - name: make
        run: docker run --rm -v ${PWD}:/project wiistreamustream-builder make

      - name: Check the plugin was produced
        run: test -f wiistreamustream.wps

      - name: Package
        run: |
          mkdir -p wiiu/environments/aroma/plugins
          cp wiistreamustream.wps wiiu/environments/aroma/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: wiistreamustream
          path: plugin/wiiu
          if-no-files-found: error

  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the builder image
        run: docker build . -t wiistreamustream-builder

      # DEBUG=1 turns on the WHBLog output, which is how you see the per-second
      # capture/encode/drop counters over UDP while the stream is running.
      - name: make DEBUG=1
        run: docker run --rm -v ${PWD}:/project wiistreamustream-builder make DEBUG=1

      - uses: actions/upload-artifact@v4
        with:
          name: wiistreamustream-debug
          path: plugin/wiistreamustream.wps
          if-no-files-found: error
